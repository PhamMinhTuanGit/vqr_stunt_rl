# M-TO0 model-audit inputs only. This file intentionally contains no optimizer,
# force, dynamics, or trajectory settings.
milestone: M-TO0

model:
  # Resolved relative to this pose_optimization directory. This is the URDF
  # recorded as asset_path by the VQRWheel USD converter metadata.
  urdf_path: ../deep_robotics_model/VQRWheel/VQRWheel_urdf/urdf/VQRWheel.urdf
  floating_base: free_flyer

contacts:
  stance: [FL, HR]
  swing: [FR, HL]
  wheel_body_frames:
    FL: FL_WHEEL
    FR: FR_WHEEL
    HL: HL_WHEEL
    HR: HR_WHEEL

nominal:
  # Isaac Lab InitialStateCfg uses wxyz; Pinocchio stores the same identity
  # quaternion in q as xyzw = [0, 0, 0, 1].
  base_position_xyz: [0.0, 0.0, 0.45]
  base_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  joint_order_isaac_lab:
    - FL_HipX_joint
    - FR_HipX_joint
    - HL_HipX_joint
    - HR_HipX_joint
    - FL_HipY_joint
    - FR_HipY_joint
    - HL_HipY_joint
    - HR_HipY_joint
    - FL_Knee_joint
    - FR_Knee_joint
    - HL_Knee_joint
    - HR_Knee_joint
    - FL_WHEEL
    - FR_WHEEL
    - HL_WHEEL
    - HR_WHEEL
  joint_positions:
    FL_HipX_joint: 0.0
    FR_HipX_joint: 0.0
    HL_HipX_joint: 0.0
    HR_HipX_joint: 0.0
    FL_HipY_joint: -0.65
    FR_HipY_joint: -0.65
    HL_HipY_joint: -0.65
    HR_HipY_joint: -0.65
    FL_Knee_joint: 1.3
    FR_Knee_joint: 1.3
    HL_Knee_joint: 1.3
    HR_Knee_joint: 1.3
    FL_WHEEL: 0.0
    FR_WHEEL: 0.0
    HL_WHEEL: 0.0
    HR_WHEEL: 0.0

audit_expectations:
  wheel_collision_radius_m: 0.091
  wheel_frame_convention: wheel_center
  urdf_position_limits_rad:
    HipX: [-0.7854, 0.7854]
    HipY: [-3.4, 2.4]
    Knee: [0.8116, 2.7663]
    wheel: continuous_unbounded
  urdf_effort_limits_nm:
    leg: 60.0
    wheel: null
  isaac_lab_actuator_effort_limits_nm:
    leg: 60.0
    wheel: 20.0
