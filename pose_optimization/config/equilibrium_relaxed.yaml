# Incremental M-TO1B kinematic and M-TO2 static-dynamics settings. There are no
# trajectory or RL variables in this file.
milestone: M-TO1B

model:
  # Resolved relative to this pose_optimization directory. This is the URDF
  # recorded as asset_path by the VQRWheel USD converter metadata.
  urdf_path: ../deep_robotics_model/VQRWheel/VQRWheel_urdf/urdf/VQRWheel.urdf
  floating_base: free_flyer

contacts:
  stance: [FL, HR]
  swing: [FR, HL]
  wheel_body_frames:
    FL: FL_WHEEL
    FR: FR_WHEEL
    HL: HL_WHEEL
    HR: HR_WHEEL

nominal:
  # Isaac Lab InitialStateCfg uses wxyz; Pinocchio stores the same identity
  # quaternion in q as xyzw = [0, 0, 0, 1].
  base_position_xyz: [0.0, 0.0, 0.45]
  base_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  joint_order_isaac_lab:
    - FL_HipX_joint
    - FR_HipX_joint
    - HL_HipX_joint
    - HR_HipX_joint
    - FL_HipY_joint
    - FR_HipY_joint
    - HL_HipY_joint
    - HR_HipY_joint
    - FL_Knee_joint
    - FR_Knee_joint
    - HL_Knee_joint
    - HR_Knee_joint
    - FL_WHEEL
    - FR_WHEEL
    - HL_WHEEL
    - HR_WHEEL
  joint_positions:
    FL_HipX_joint: 0.0
    FR_HipX_joint: 0.0
    HL_HipX_joint: 0.0
    HR_HipX_joint: 0.0
    FL_HipY_joint: -0.65
    FR_HipY_joint: -0.65
    HL_HipY_joint: -0.65
    HR_HipY_joint: -0.65
    FL_Knee_joint: 1.3
    FR_Knee_joint: 1.3
    HL_Knee_joint: 1.3
    HR_Knee_joint: 1.3
    FL_WHEEL: 0.0
    FR_WHEEL: 0.0
    HL_WHEEL: 0.0
    HR_WHEEL: 0.0

audit_expectations:
  wheel_collision_radius_m: 0.091
  wheel_collision_length_m: 0.04
  wheel_collision_origin_xyz: [0.0, 0.0, 0.0]
  wheel_collision_origin_rpy: [1.5709, 0.0, 0.0]
  wheel_joint_axis_local: [0.0, -1.0, 0.0]
  wheel_frame_convention: wheel_center
  wheel_center_coordinate_frame: world
  urdf_position_limits_rad:
    HipX: [-0.7854, 0.7854]
    HipY: [-3.4, 2.4]
    Knee: [0.8116, 2.7663]
    wheel: continuous_unbounded
  urdf_effort_limits_nm:
    leg: 60.0
    wheel: null
  isaac_lab_actuator_effort_limits_nm:
    leg: 60.0
    wheel: 20.0

optimization:
  variables:
    - base_z
    - base_roll
    - base_pitch
    - 12_leg_joint_positions
  fixed:
    base_x: 0.0
    base_y: 0.0
    base_yaw: 0.0
    wheel_angles: 0.0
  ground_z_m: 0.0
  joint_margin_rad: 0.05
  orientation_limit_deg: 25.0
  segment_margin_m: 0.020
  base_height_reference_m: 0.45
  weights:
    pose: 1.0
    orientation: 10.0
    base_height: 1.0
  continuation:
    - {name: A, swing_clearance_m: 0.000, com_tolerance_m: 0.010}
    - {name: B, swing_clearance_m: 0.005, com_tolerance_m: 0.008}
    - {name: C, swing_clearance_m: 0.010, com_tolerance_m: 0.005}
    - {name: D, swing_clearance_m: 0.020, com_tolerance_m: 0.002}
  ipopt:
    tolerance: 1.0e-8
    acceptable_tolerance: 1.0e-6
    constraint_violation_tolerance: 1.0e-9
    max_iterations: 3000

static_optimization:
  initial_guess: ../output/kinematic_equilibrium_FL_HR.yaml
  swing_clearance_m: 0.020
  com_tolerance_m: 0.002
  segment_margin_m: 0.020
  joint_margin_rad: 0.05
  orientation_limit_deg: 25.0
  friction_coefficient: 0.6
  torque_limits_nm:
    leg: 60.0
    # Isaac Lab actuator configuration only; not a URDF/hardware verified limit.
    wheel: 20.0
  weights:
    pose: 1.0
    orientation: 10.0
    base_height: 1.0
    torque: 1.0e-3
    force: 1.0e-4
  continuation:
    - {name: A, friction: false, positive_normal: false, torque_limits: false}
    - {name: B, friction: true, positive_normal: true, torque_limits: false}
    - {name: C, friction: true, positive_normal: true, torque_limits: true}
  ipopt:
    tolerance: 1.0e-9
    acceptable_tolerance: 1.0e-7
    constraint_violation_tolerance: 1.0e-10
    max_iterations: 1500

aligned_static_optimization:
  initial_guess: ../output/static_equilibrium_FL_HR.yaml
  hipx_weight: 0.5
  wheel_body_alignment_limit_deg: 8.0
  stance_wheel_parallel_limit_deg: 5.0
  wheel_axle_horizontal_limit_deg: 8.0
  com_tolerance_continuation_m: [0.002, 0.005, 0.010]
  ipopt:
    tolerance: 1.0e-9
    acceptable_tolerance: 1.0e-7
    constraint_violation_tolerance: 1.0e-10
    max_iterations: 2500

sideways_static_optimization:
  initial_guess: ../output/static_equilibrium_FL_HR_aligned.yaml
  eps_x_continuation_m: [0.10, 0.07, 0.05, 0.03]
  y_separation_min_m: 0.35
  support_direction_limit_deg: 5.0
  com_tolerance_m: 0.005
  preferred_swing_clearance_m: 0.030
  fallback_swing_clearance_m: 0.020
  dx_weight: 10.0
  ipopt:
    tolerance: 1.0e-9
    acceptable_tolerance: 1.0e-7
    constraint_violation_tolerance: 1.0e-10
    max_iterations: 2500
